[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gana-cli"
version = "1.0.0"
description = "CLI for GANA — Map. Normalize. Understand."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
gana = "main:cli"
