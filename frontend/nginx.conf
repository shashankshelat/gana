server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html points at hashed bundles that are replaced on every build. Never store it:
        # with only no-cache, Chrome can still restore a stale copy that references deleted bundles.
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /assets/ {
        # Filenames are content-hashed, so they can be cached indefinitely
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    location /webhooks {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}

# Webhook-only listener: the one port that is safe to expose publicly (e.g. through a tunnel for Slack).
# Only vendor webhooks are proxied; the portal and the rest of the API are not reachable here.
server {
    listen 8081;
    server_name _;

    location /api/connectors/webhooks/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 5m;
    }

    location / {
        return 404;
    }
}
